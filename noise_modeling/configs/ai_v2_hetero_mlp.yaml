experiment_name: ai_v2_hetero_mlp
seed: 42
output_dir: outputs/noise_modeling/checkpoints

data:
  npz_root: outputs/noise_modeling/npz
  normalization_stats: outputs/noise_modeling/normalization_stats.json
  feature_set: v2
  use_sequence: false
  normalize_features: true
  normalize_targets: true

model:
  type: hetero_mlp_v2
  input_dim: 20
  hidden_dims: [256, 256, 128]
  dropout: 0.0
  min_sigma: 0.0001

training:
  batch_size: 4096
  eval_batch_size: 8192
  epochs: 120
  lr: 0.001
  weight_decay: 0.00001
  loss: gaussian_nll
  lambda_state: 0.0
  early_stopping_patience: 15
  num_workers: 2
  grad_clip: 5.0

